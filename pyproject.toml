[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fin-smt-reconcile"
version = "0.1.0"
description = "Cross-page financial table topology reconstruction and Z3 SMT reconciliation engine"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.maturin]
python-source = "python"
module-name = "fin_smt_reconcile._core"
features = ["pyo3/extension-module"]
